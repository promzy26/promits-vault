<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promit's Vault - Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <script src="under-development.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white min-h-screen flex flex-col justify-between transition-colors duration-200">

    <div>
        <!-- Header & Search -->
        <header class="bg-white/80 dark:bg-slate-900/85 backdrop-blur border-b border-slate-200 dark:border-slate-800 py-4 px-6 sticky top-0 z-45">
            <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                <h1 class="text-xl font-bold tracking-wide text-indigo-600 dark:text-indigo-400">⚡ Promit's Vault</h1>
                
                <!-- Search Container with Clear Button -->
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchInput" placeholder="Search apps..." 
                        class="w-full px-4 py-2 pr-9 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-slate-900 dark:text-white">
                    <button id="clearSearch" onclick="clearSearchInput()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white hidden font-bold text-sm">
                        &times;
                    </button>
                </div>
            </div>
        </header>

        <!-- App Grid Container -->
        <main class="max-w-4xl mx-auto p-4 sm:p-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300">Available Apps</h2>
            <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Apps load here dynamically -->
            </div>
        </main>
    </div>

    <!-- Compact Footer (Always at the bottom) -->
    <footer class="max-w-4xl mx-auto my-6 px-6 w-full">
        <div class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/80 py-2.5 px-4 rounded-xl text-center text-xs text-slate-500 dark:text-slate-400 w-full shadow-sm">
            &copy; 2026 Promit's Vault. Created with passion by Promit. All rights reserved.
        </div>
    </footer>

    <!-- App Details Popup Modal (Medium Blur Background) -->
    <div id="appModal" class="fixed inset-0 bg-black/30 dark:bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 transition-all">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 dark:hover:text-white font-bold text-lg">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let allApps = [];

        async function fetchApps() {
            try {
                const response = await fetch('apps.json');
                allApps = await response.json();
                displayApps(allApps);
            } catch (error) {
                console.error("Error loading apps:", error);
                document.getElementById('appGrid').innerHTML = `
                    <p class="text-red-400 col-span-full text-center py-6 text-sm">
                        Unable to load apps.json. Make sure your file is named correctly as apps.json!
                    </p>`;
            }
        }

        function displayApps(list) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 dark:text-slate-500 col-span-full text-center py-10">No apps found.</p>`;
                return;
            }

            list.forEach(app => {
                grid.innerHTML += `
                    <div onclick="openModal('${app.id}')" class="bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/80 rounded-2xl p-4 hover:border-indigo-500/50 transition cursor-pointer flex items-center gap-4 shadow-sm">
                        <img src="${app.icon}" alt="${app.name}" class="w-16 h-16 rounded-xl object-cover shadow-md shrink-0">
                        <div class="flex-1 min-w-0">
                            <span class="text-[10px] bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full font-medium">${app.category}</span>
                            <h3 class="font-bold text-base text-slate-900 dark:text-white truncate mt-1">${app.name}</h3>
                            <p class="text-slate-500 dark:text-slate-400 text-xs truncate">${app.description}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            const app = allApps.find(a => a.id === id);
            if (!app) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <img src="${app.icon}" alt="${app.name}" class="w-20 h-20 rounded-2xl object-cover shadow-lg shrink-0">
                    <div>
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white">${app.name}</h3>
                        <span class="text-xs bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 px-2.5 py-0.5 rounded-full font-medium">${app.category}</span>
                        <div class="flex gap-3 mt-2 text-xs text-slate-500 dark:text-slate-400">
                            <span>Ver: <strong class="text-slate-900 dark:text-white">${app.version}</strong></span>
                            <span>Size: <strong class="text-slate-900 dark:text-white">${app.size}</strong></span>
                        </div>
                    </div>
                </div>
                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed mb-6">${app.description}</p>
                <a href="${app.downloadUrl}" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-center font-bold text-white rounded-xl shadow-lg transition duration-200 text-sm">
                    Download APK (${app.size})
                </a>
            `;
            document.getElementById('appModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
        }

        // Search & Clear Button Logic
        const searchInput = document.getElementById('searchInput');
        const clearButton = document.getElementById('clearSearch');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            if (query.length > 0) {
                clearButton.classList.remove('hidden');
            } else {
                clearButton.classList.add('hidden');
            }

            const filtered = allApps.filter(app => app.name.toLowerCase().includes(query) || app.category.toLowerCase().includes(query));
            displayApps(filtered);
        });

        function clearSearchInput() {
            searchInput.value = '';
            clearButton.classList.add('hidden');
            displayApps(allApps);
            searchInput.focus();
        }

        fetchApps();
    </script>
</body>
</html>
